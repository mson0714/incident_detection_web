services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: urban-observatory-web:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "${APP_KEY:-}"
      APP_URL: "${APP_URL:-http://localhost:8080}"
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:?Set DB_DATABASE in web/.env before starting}"
      DB_USERNAME: "${DB_USERNAME:?Set DB_USERNAME in web/.env before starting}"
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in web/.env before starting}"
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      URBAN_MODE: "${URBAN_MODE:-synthetic}"
      URBAN_CITY: "${URBAN_CITY:-Ho Chi Minh City}"
      URBAN_TIMEZONE: "${URBAN_TIMEZONE:-Asia/Ho_Chi_Minh}"
      URBAN_THRESHOLD: "${URBAN_THRESHOLD:-35}"
      URBAN_COOLDOWN_HOURS: "${URBAN_COOLDOWN_HOURS:-6}"
      URBAN_FRESHNESS_MINUTES: "${URBAN_FRESHNESS_MINUTES:-90}"
      URBAN_FORECAST_FRESHNESS_MINUTES: "${URBAN_FORECAST_FRESHNESS_MINUTES:-90}"
      URBAN_RULE_VERSION: "${URBAN_RULE_VERSION:-pm25-two-consecutive-v1}"
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/api/health') === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:?Set DB_DATABASE in web/.env before starting}"
      MYSQL_USER: "${DB_USERNAME:?Set DB_USERNAME in web/.env before starting}"
      MYSQL_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in web/.env before starting}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in web/.env before starting}"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h127.0.0.1 -u\"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  mysql_data:
  app_storage:
