      <path d="M795 248L854 131L929 190L1008 111L1043 266L929 190L944 302L795 248" stroke-width="1.5" stroke-opacity=".5"/>
      <path d="M854 131L1043 266M795 248L929 190" stroke-opacity=".22"/>
    </g>
    <g fill="#5eead4" stroke="#0b1118" stroke-width="3">
      <circle cx="795" cy="248" r="7"/>
