    <circle cx="1043" cy="266" r="8" fill="#f2b866" stroke="#0b1118" stroke-width="3"/>
    <circle cx="1043" cy="266" r="19" fill="none" stroke="#f2b866" stroke-opacity=".45"/>
    <g font-family="'Trebuchet MS', sans-serif">
      <rect x="56" y="54" width="32" height="32" rx="9" fill="#5eead4"/>
      <circle cx="67" cy="65" r="4" fill="none" stroke="#0b1118" stroke-width="2"/>
      <circle cx="78" cy="76" r="4" fill="none" stroke="#0b1118" stroke-width="2"/>
      <text x="103" y="76" fill="#a9c1ce" font-size="14" letter-spacing="2.5">URBAN OBSERVATORY</text>
      <text x="52" y="174" fill="#e9eef4" font-size="80" font-weight="700" letter-spacing="-4">Air<tspan fill="#5eead4">scope</tspan><tspan fill="#5eead4">.</tspan></text>
      <text x="56" y="225" fill="#e9eef4" font-size="29" letter-spacing="-.7">Urban intelligence, in focus.</text>
      <text x="57" y="261" fill="#a9c1ce" font-size="18">Observe stations. Explore forecasts. Trace alerts.</text>
