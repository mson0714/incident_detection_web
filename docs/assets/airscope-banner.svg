<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Airscope - Urban intelligence, in focus.</title>
  <desc id="desc">A teal station network over an abstract skyline illustrates the urban observatory. Decorative artwork, not a map or measured data.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0b1118"/>
      <stop offset="1" stop-color="#17344a"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#5eead4" stop-opacity=".16"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skyline" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#2b6171" stop-opacity=".55"/>
      <stop offset="1" stop-color="#17344a" stop-opacity=".08"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#8dc4d2" stroke-opacity=".06"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="420" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
